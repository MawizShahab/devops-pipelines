name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v2.328.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm Install

      - name: Run Tests
        run: npm test
